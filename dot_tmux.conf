# ============================================================
#  ~/.tmux.conf
#  Configuracao para DevOps / Platform Engineering
#  catppuccin/tmux v1 (v0.3.0 — sintaxe de modulos antiga)
#  + funcoes estilo Zellij + sesh
# ============================================================

# ------------------------------------------------------------
# COMPORTAMENTO BASICO
# ------------------------------------------------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g history-limit 50000
set -g focus-events on
setw -g mode-keys vi
set -g set-clipboard on
set -g detach-on-destroy off

# --- Prefixo duplo: Ctrl+b padrao continua, Ctrl+a como atalho extra ---
set -g prefix C-b
set -g prefix2 C-a
bind C-a send-prefix -2
bind C-b send-prefix

# --- Cor verdadeira ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"

# --- Posicao da barra ---
set -g status-position top

# ------------------------------------------------------------
# VISUAL — catppuccin/tmux v1 (v0.3.0)
#   Todas as @catppuccin_* precisam vir ANTES do 'run'.
# ------------------------------------------------------------
set -g @catppuccin_flavor "mocha"

# Janelas: pilulas arredondadas com numero a direita
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

# Modulos da barra
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_background "default"
# Texto do modulo directory: so o nome da pasta atual
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# Formato da hora
set -g @catppuccin_date_time_text "%H:%M"

# --- Carrega o plugin (clone manual em ~/.config/tmux/plugins/catppuccin) ---
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ------------------------------------------------------------
# BORDA DOS PAINEIS (so cor, sem texto)
# ------------------------------------------------------------
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#89b4fa,bold"

# ------------------------------------------------------------
# FUNCOES ESTILO ZELLIJ
# ------------------------------------------------------------
# Painel flutuante (equivalente ao floating pane do Zellij)
bind -N "terminal flutuante" f display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind -N "monitor de processos" g display-popup -E -w 80% -h 80% htop

# Descoberta de atalhos: prefix + ? ja lista todos os keybinds (nativo)

# ------------------------------------------------------------
# SESH — troca de sessao inteligente (popup fuzzy)
# ------------------------------------------------------------
bind -N "trocar sessao (sesh)" s display-popup -E -w 60% -h 60% "sesh connect \"\$(sesh list | fzf --height 100% --reverse)\""
bind x kill-pane
bind -N "ultima sessao (sesh)" L run-shell "sesh last"

# ------------------------------------------------------------
# SPLITS herdam o diretorio atual
# ------------------------------------------------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "$HOME"

# ------------------------------------------------------------
# PLUGINS (via TPM)
#   Nota: catppuccin NAO entra aqui — e carregado via 'run' acima.
# ------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'sainnhe/tmux-fzf'

# Persistencia: salva em background, mas NAO restaura ao abrir.
# Para voltar a sessao anterior, use os aliases 'tmux-restore' / 'tmux-save'.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# TPM precisa ser a ultima linha
run '~/.tmux/plugins/tpm/tpm'
